<title>Alleria Studio — Spot</title>
<style>
@font-face{font-family:'Fraunces';src:url(assets/fonts/Fraunces-latin.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:'Manrope';src:url(assets/fonts/Manrope-latin.woff2) format('woff2');font-weight:200 800}
@font-face{font-family:'JetBrains Mono';src:url(assets/fonts/JetBrainsMono-latin.woff2) format('woff2');font-weight:100 800}
:root{--bg:#FAF6EF;--ink:#1E1B18;--terra:#E2603A;--lemon:#F2C94C;--sage:#9DB5A0;--teal:#2F6F73;--sand:#F4E3CF;--card:#FFFDF9;--line:#EEE5D7;--muted:#6B645C;--green:#3C9A5F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
body{font-family:'Manrope',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#root{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
#world{position:absolute;left:0;top:0;width:3160px;height:5220px;transform-origin:0 0;will-change:transform}
#grid{position:absolute;inset:-1600px;background-image:radial-gradient(circle,#E3D8C6 2.4px,transparent 2.6px);background-size:44px 44px}
.abs{position:absolute}
.mod{position:absolute;width:960px;height:1200px;background:var(--card);border-radius:44px;border:2px solid #EDE3D3;box-shadow:0 40px 90px rgba(90,60,30,.10),0 6px 18px rgba(90,60,30,.06);overflow:hidden}
.hd{position:absolute;left:0;top:0;width:100%;height:100px;display:flex;align-items:center;gap:18px;padding:0 40px;border-bottom:2px solid var(--line);background:#FFFDF9;z-index:5}
.hl{width:46px;height:46px}
.ht{font-weight:800;font-size:34px;letter-spacing:-.5px}
.hc{margin-left:auto;font-family:'JetBrains Mono';font-size:22px;color:var(--muted);background:#F6F0E6;padding:10px 18px;border-radius:30px}
.bd{position:absolute;inset:0}
.bd>*{position:absolute}
.btn{display:flex;align-items:center;justify-content:center;border-radius:60px;background:var(--terra);color:#fff;font-weight:800;font-size:34px;box-shadow:0 12px 26px rgba(226,96,58,.30)}
.btn.ink{background:var(--ink);box-shadow:0 10px 22px rgba(30,27,24,.25);font-size:28px}
.panel{background:#fff;border-radius:30px;border:3px solid var(--line)}
.lbl{font-family:'JetBrains Mono';font-size:22px;color:var(--muted);letter-spacing:2px}
.chip{display:flex;align-items:center;gap:12px;height:76px;padding:0 30px;border-radius:40px;font-weight:700;font-size:31px;white-space:nowrap}
.chip i{width:14px;height:14px;border-radius:50%;display:block}
.tile{width:260px;height:260px;border-radius:26px;overflow:hidden;box-shadow:0 10px 24px rgba(60,40,20,.12)}
.tile svg{display:block;width:100%;height:100%}
.serif{font-family:'Fraunces',serif}
.mono{font-family:'JetBrains Mono',monospace}
#ov{position:absolute;inset:0;pointer-events:none}
#ov>*{position:absolute}
.curtain{top:0;width:560px;height:1920px;background:repeating-linear-gradient(90deg,#F6EFE3 0 46px,#F1E8DA 46px 70px,#F6EFE3 70px 92px);}
.cap{left:540px;top:1580px;padding:26px 52px 34px;border-radius:48px;background:rgba(255,253,249,.92);border:2px solid #EDE3D3;box-shadow:0 30px 70px rgba(90,60,30,.16);white-space:nowrap;font-family:'Fraunces',serif;font-weight:650;letter-spacing:-1.5px;transform-origin:50% 100%}
.cap span{display:inline-block;will-change:transform}
.cap .a{color:var(--terra)}
#trail{left:0;top:0;width:1080px;height:1920px;overflow:visible}
#cursor{left:0;top:0;width:64px;height:64px}
#cursor svg{position:absolute;left:0;top:0;width:64px;height:64px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.22))}
.ripple{left:0;top:0;width:100px;height:100px;border-radius:50%;border:5px solid var(--terra)}
#loupe{width:104px;height:104px;border-radius:50%;border:8px solid #fff;box-shadow:0 10px 26px rgba(0,0,0,.25)}
#ria{left:0;top:0;width:150px;height:150px;transform-origin:50% 100%}
#ria svg{width:150px;height:150px;overflow:visible;filter:drop-shadow(0 10px 10px rgba(120,80,20,.22))}
#end{left:0;top:0;width:1080px;height:1920px;transform-origin:540px 900px}
#end>*{position:absolute}
.kf{width:30px;height:30px;background:var(--terra);transform:rotate(45deg);border-radius:5px;box-shadow:0 0 0 5px #fff}
.rc{display:flex;align-items:flex-start;gap:0}
.rc .tag{margin-left:-6px;margin-top:40px;padding:6px 14px;border-radius:16px;color:#fff;font-weight:700;font-size:22px}
.row{display:flex;align-items:center;gap:20px}
</style>
</head>
